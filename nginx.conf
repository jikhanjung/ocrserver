events {
    worker_connections 1024;
}

http {
    upstream chandra {
        least_conn;
        server chandra-a:8000;
        server chandra-b:8000;
        keepalive 16;
    }

    server {
        listen 80;

        # OCR 요청은 이미지(base64) 포함 → 페이지당 최대 수 MB
        client_max_body_size 32m;

        location / {
            proxy_pass http://chandra;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # vLLM 응답이 느릴 수 있음 (긴 페이지 OCR = 수십 초)
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        location /health {
            proxy_pass http://chandra;
            proxy_read_timeout 5s;
        }
    }
}
