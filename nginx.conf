events {
    worker_connections 1024;
}

http {
    upstream chandra {
        server chandra-a:8000;
        keepalive 16;
    }

    upstream wrapper {
        server wrapper:8000;
    }

    server {
        listen 80;

        # Dashboard
        location = / {
            proxy_pass http://wrapper;
        }

        # Wrapper: OCR job API + stats
        location /ocr {
            client_max_body_size 200m;
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /api/ {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
        }

        location = /status {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
        }

        # General LLM: Qwen3-14B (GPU 1)
        # /llm/v1/chat/completions → llm:8000/v1/chat/completions
        location /llm/ {
            proxy_pass http://llm:8000/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # Chandra OCR: health + vLLM API (GPU 0)
        location /health {
            proxy_pass http://chandra;
            proxy_read_timeout 5s;
        }

        location / {
            client_max_body_size 32m;
            proxy_pass http://chandra;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }
}
