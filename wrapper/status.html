<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Status — OCR Server</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar { background: #1a2f5a; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .status-dot {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot-ok      { background: #198754; }
    .dot-down    { background: #dc3545; }
    .dot-loading { background: #ffc107; }
    .metric-label { font-size: .78rem; color: #6c757d; text-transform: uppercase; letter-spacing: .04em; }
    .metric-value { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
    .refresh-badge { font-size: .72rem; color: #adb5bd; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulsing { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <a class="navbar-brand fw-bold text-white" href="/">OCR Server</a>
  <div class="d-flex gap-3 align-items-center">
    <a class="text-white-50 text-decoration-none small" href="/">대시보드</a>
    <span class="text-white small fw-semibold">서비스 상태</span>
    <span class="refresh-badge pulsing" id="refreshBadge">자동 새로고침</span>
  </div>
</nav>

<div class="container" style="max-width:860px">

  <!-- Service cards -->
  <div class="row g-3 mb-4">

    <!-- Chandra OCR -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="mb-0 fw-semibold">Chandra OCR</h5>
              <div class="text-muted small mt-1">datalab-to/chandra-ocr-2 · GPU 0</div>
            </div>
            <span id="chandraStatus" class="badge fs-6 px-3 py-2">확인 중...</span>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <div class="metric-label">HTTP</div>
              <div class="metric-value" id="chandraHttp">—</div>
            </div>
            <div class="col-6">
              <div class="metric-label">엔드포인트</div>
              <div class="text-muted small text-truncate" id="chandraUrl">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- LLM -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="mb-0 fw-semibold">Qwen3-14B LLM</h5>
              <div class="text-muted small mt-1">Qwen/Qwen3-14B · GPU 1</div>
            </div>
            <span id="llmStatus" class="badge fs-6 px-3 py-2">확인 중...</span>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <div class="metric-label">HTTP</div>
              <div class="metric-value" id="llmHttp">—</div>
            </div>
            <div class="col-6">
              <div class="metric-label">엔드포인트</div>
              <div class="text-muted small text-truncate" id="llmUrl">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Wrapper / system info -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <h6 class="fw-semibold mb-3">Wrapper 시스템</h6>
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <div class="metric-label">가동 시간</div>
          <div class="metric-value fs-5" id="uptime">—</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="metric-label">동시성 (Semaphore)</div>
          <div class="metric-value fs-5" id="concurrency">—</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="metric-label">총 Job</div>
          <div class="metric-value fs-5" id="totalJobs">—</div>
        </div>
        <div class="col-6 col-md-3">
          <div class="metric-label">처리 중</div>
          <div class="metric-value fs-5" id="processingJobs">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick test -->
  <div class="card mb-4">
    <div class="card-body p-4">
      <h6 class="fw-semibold mb-3">빠른 테스트</h6>
      <div class="row g-2">
        <div class="col-auto">
          <button class="btn btn-sm btn-outline-secondary" onclick="testEndpoint('/health','chandraTest')">Chandra /health</button>
          <span class="ms-2 text-muted small" id="chandraTest"></span>
        </div>
        <div class="col-auto">
          <button class="btn btn-sm btn-outline-secondary" onclick="testEndpoint('/llm/health','llmTest')">LLM /llm/health</button>
          <span class="ms-2 text-muted small" id="llmTest"></span>
        </div>
        <div class="col-auto">
          <button class="btn btn-sm btn-outline-secondary" onclick="testEndpoint('/llm/v1/models','llmModels')">LLM /v1/models</button>
          <span class="ms-2 text-muted small" id="llmModels"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="text-muted small text-end mb-4" id="lastChecked"></div>
</div>

<script>
function fmt(s) {
  if (s < 60) return s + '초';
  if (s < 3600) return Math.floor(s/60) + '분 ' + (s%60) + '초';
  return Math.floor(s/3600) + '시간 ' + Math.floor((s%3600)/60) + '분';
}

function setBadge(el, status, code) {
  el.className = 'badge fs-6 px-3 py-2';
  if (status === 'ok') { el.classList.add('bg-success'); el.textContent = '정상 ✓'; }
  else if (status === 'down') { el.classList.add('bg-danger'); el.textContent = '오프라인'; }
  else { el.classList.add('bg-warning', 'text-dark'); el.textContent = '오류 ' + (code||''); }
}

async function refresh() {
  try {
    const [svc, stats] = await Promise.all([
      fetch('/api/services').then(r=>r.json()),
      fetch('/api/stats').then(r=>r.json()),
    ]);

    const ch = svc.chandra || {};
    setBadge(document.getElementById('chandraStatus'), ch.status, ch.http_status);
    document.getElementById('chandraHttp').textContent = ch.http_status ?? '—';
    document.getElementById('chandraUrl').textContent = svc._meta?.chandra_url ?? '—';
    document.getElementById('chandraUrl').title = svc._meta?.chandra_url ?? '';

    const llm = svc.llm || {};
    setBadge(document.getElementById('llmStatus'), llm.status, llm.http_status);
    document.getElementById('llmHttp').textContent = llm.http_status ?? '—';
    document.getElementById('llmUrl').textContent = svc._meta?.llm_url ?? '—';
    document.getElementById('llmUrl').title = svc._meta?.llm_url ?? '';

    document.getElementById('uptime').textContent = fmt(svc._meta?.uptime_s ?? 0);
    document.getElementById('concurrency').textContent = svc._meta?.concurrency ?? '—';
    document.getElementById('totalJobs').textContent = stats.counts?.total ?? '—';
    document.getElementById('processingJobs').textContent = stats.counts?.processing ?? '—';

    document.getElementById('lastChecked').textContent =
      '마지막 확인: ' + new Date().toLocaleTimeString('ko-KR');
  } catch(e) {
    document.getElementById('lastChecked').textContent = '데이터 로드 실패: ' + e.message;
  }
}

async function testEndpoint(path, targetId) {
  const el = document.getElementById(targetId);
  el.textContent = '확인 중...';
  try {
    const r = await fetch(path);
    el.textContent = `HTTP ${r.status}`;
    el.className = r.ok ? 'ms-2 text-success small' : 'ms-2 text-danger small';
  } catch(e) {
    el.textContent = '연결 실패';
    el.className = 'ms-2 text-danger small';
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
