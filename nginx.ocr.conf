events {
    worker_connections 1024;
}

http {
    upstream chandra {
        least_conn;
        server chandra-a:8000;
        server chandra-b:8000;
        keepalive 16;
    }

    upstream wrapper {
        server wrapper:8000;
    }

    server {
        listen 80;

        # Friendly page shown while wrapper is being recreated (mode switch
        # or routine restart). Triggered by error_page on wrapper locations
        # below via proxy_intercept_errors.
        location = /__restarting {
            internal;
            root /etc/nginx/errors;
            try_files /restarting.html =503;
        }

        # Dashboard
        location = / {
            proxy_pass http://wrapper;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # Wrapper: OCR job API + stats
        location /ocr {
            client_max_body_size 200m;
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 504 = /__restarting;
        }

        location /api/ {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 504 = /__restarting;
        }

        location = /status {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location = /metrics {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location /static/ {
            proxy_pass http://wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # /llm/ omitted in OCR mode (llm container is stopped)

        # Chandra OCR: health + vLLM API (GPU 0 + GPU 1)
        location /health {
            proxy_pass http://chandra;
            proxy_read_timeout 5s;
        }

        location / {
            client_max_body_size 32m;
            proxy_pass http://chandra;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }
}
