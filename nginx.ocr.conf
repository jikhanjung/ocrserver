events {
    worker_connections 1024;
}

http {
    upstream chandra {
        zone chandra 64k;
        least_conn;
        server chandra-a:8000 resolve;
        server chandra-b:8000 resolve;
        keepalive 16;
    }

    # Docker's embedded DNS. Upstreams referenced through variables below are
    # re-resolved per request (10s cache) so a recreated wrapper/llmwrapper
    # container with a new IP is picked up without `nginx -s reload`.
    # (A static `upstream {}` block resolves names once at load time — that
    # bit us on 2026-08-28, devlog 042 §5.)
    #
    # The chandra upstream uses `server ... resolve` (open-source nginx >=
    # 1.27.3, needs `zone`) for the same reason: on 2026-09-08 a stopped
    # chandra-b's IP was re-used by a recreated wrapper, and the static
    # upstream kept sending OCR pages to it (404 storm, devlog 043). With
    # `resolve`, a name that disappears is dropped from the pool (re-checked
    # every ~30s) and one that comes back is re-added, and nginx still starts
    # when a name does not resolve at all.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        set $wrapper http://wrapper:8000;

        # Friendly page shown while wrapper is being recreated (mode switch
        # or routine restart). Triggered by error_page on wrapper locations
        # below via proxy_intercept_errors.
        location = /__restarting {
            internal;
            root /etc/nginx/errors;
            try_files /restarting.html =503;
        }

        # Dashboard
        location = / {
            proxy_pass $wrapper;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # Wrapper: OCR job API + stats
        location /ocr {
            client_max_body_size 500m;
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 504 = /__restarting;
        }

        # /api/ is JSON only — let 502/504 through as-is so the fetch()
        # client sees an error, not a 200 HTML page (which the browser
        # would happily cache for the URL).
        # ── figure-split jobs (wrapper 0.3.0, P02) ──
        # /pdfs: PDF store without OCR (large uploads). /figures: job API + workspace text.
        location /pdfs {
            client_max_body_size 500m;
            proxy_pass $wrapper;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }
        location /figures {
            client_max_body_size 64m;
            proxy_pass $wrapper;
            proxy_read_timeout 60s;
        }
        # host worker only: docker bridge gateway + loopback. Token-checked again in the wrapper.
        location /internal/ {
            allow 127.0.0.1;
            allow 172.18.0.0/16;
            deny all;
            client_max_body_size 64m;
            proxy_pass $wrapper;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
        }

        location = /status {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location = /metrics {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location /static/ {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # /llm/ omitted in OCR mode (llm container is stopped)

        # Chandra OCR: health + vLLM API (GPU 0 + GPU 1)
        location /health {
            proxy_pass http://chandra;
            proxy_read_timeout 5s;
        }

        location / {
            client_max_body_size 32m;
            proxy_pass http://chandra;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }
}
