services:
  chandra-a:
    image: honestjung/ocrserver:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    restart: unless-stopped

  chandra-b:
    image: honestjung/ocrserver:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    ports:
      - "8001:8000"
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    restart: unless-stopped
