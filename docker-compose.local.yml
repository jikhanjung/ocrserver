services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chandra-a
      - chandra-b
    restart: unless-stopped

  chandra-a:
    image: honestjung/ocrserver:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    restart: unless-stopped

  chandra-b:
    image: honestjung/ocrserver:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    restart: unless-stopped
