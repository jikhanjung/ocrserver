events {
    worker_connections 1024;
}

http {
    upstream chandra {
        server chandra-a:8000;
        keepalive 16;
    }

    # Docker's embedded DNS. Upstreams referenced through variables below are
    # re-resolved per request (10s cache) so a recreated wrapper/llmwrapper
    # container with a new IP is picked up without `nginx -s reload`.
    # (A static `upstream {}` block resolves names once at load time — that
    # bit us on 2026-08-28, devlog 042 §5.) chandra keeps a static upstream
    # because least_conn needs one; mode-*.sh reload nginx after (re)starting
    # chandra containers anyway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        set $wrapper http://wrapper:8000;
        set $llm http://llm:8000;
        set $llmwrapper http://llmwrapper:8000;

        # Friendly page shown while wrapper is being recreated.
        location = /__restarting {
            internal;
            root /etc/nginx/errors;
            try_files /restarting.html =503;
        }

        # Dashboard
        location = / {
            proxy_pass $wrapper;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # Wrapper: OCR job API + stats
        location /ocr {
            client_max_body_size 500m;
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 504 = /__restarting;
        }

        # /api/ is JSON only — let 502/504 through as-is so the fetch()
        # client sees an error, not a 200 HTML page (which the browser
        # would happily cache for the URL).
        location /api/ {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
        }

        location = /status {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location = /metrics {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        location /static/ {
            proxy_pass $wrapper;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 502 503 504 = /__restarting;
        }

        # General LLM: Qwen3-14B (GPU 1)
        # /llm/health goes straight to vLLM so the status page reflects the
        # actual backend (not llmwrapper's own /health).
        location = /llm/health {
            proxy_pass $llm/health;
            proxy_read_timeout 5s;
        }

        # Everything else under /llm/ goes through llmwrapper, which proxies
        # to vLLM while logging request/response to llmserver.db.
        # /llm/v1/chat/completions → llmwrapper:8000/v1/chat/completions → llm:8000/v1/chat/completions
        location /llm/ {
            client_max_body_size 32m;
            # strip the /llm/ prefix (was the trailing "/" on a literal proxy_pass;
            # with a variable proxy_pass the URI must be rewritten explicitly)
            rewrite ^/llm/(.*)$ /$1 break;
            proxy_pass $llmwrapper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            # SSE: tokens stream as they're generated.
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
        }

        # Chandra OCR: health + vLLM API (GPU 0)
        location /health {
            proxy_pass http://chandra;
            proxy_read_timeout 5s;
        }

        location / {
            client_max_body_size 32m;
            proxy_pass http://chandra;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }
    }
}
