services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-errors:/etc/nginx/errors:ro
    depends_on:
      - chandra-a
      - wrapper
    restart: unless-stopped

  wrapper:
    image: honestjung/ocrwrapper:0.3.17
    environment:
      WRAPPER_ROLE: ocr
      VLLM_URL: http://nginx:80
      OCR_CONCURRENCY: "${OCR_CONCURRENCY:-6}"
      OCR_DPI: "150"
      DB_PATH: /data/ocrserver.db
      LLM_DB_PATH: /data/llmserver.db
      MODE_TOKEN: "${MODE_TOKEN:-}"
      FIGURES_WORKER_TOKEN: "${FIGURES_WORKER_TOKEN:-}"
      FIGURES_MIN_INTERVAL: "${FIGURES_MIN_INTERVAL:-300}"
      FIGURES_HEARTBEAT_TIMEOUT: "${FIGURES_HEARTBEAT_TIMEOUT:-1800}"
      FIGURES_MAX_WORKERS: "${FIGURES_MAX_WORKERS:-0}"
      FIGURES_RESULT_TTL_DAYS: "${FIGURES_RESULT_TTL_DAYS:-365}"
    volumes:
      - ./data:/data
      - ./docker-compose.yml:/etc/ocrserver-compose.yml:ro
      # 일일 백업(scripts/backup_db.sh → docker exec)용 — 호스트는 라이브 DB 를 열지 않는다.
      # /backup 이 원본과 같은 디스크면(/mnt/disk1 미마운트 상태로 컨테이너가 생성됨) backup_db.py 가 중단한다.
      - ./backup_stage:/stage
      - /mnt/disk1/backups/ocrserver:/backup
    depends_on:
      - chandra-a
    restart: unless-stopped

  # /llm/* proxy + request/response logging (mode-llm.sh로 활성화)
  llmwrapper:
    profiles: [llm]
    image: honestjung/ocrwrapper:0.3.17
    environment:
      WRAPPER_ROLE: llm
      LLM_UPSTREAM: http://llm:8000
      LLM_DB_PATH: /data/llmserver.db
    volumes:
      - ./data:/data
    depends_on:
      - llm
    restart: unless-stopped

  chandra-a:
    image: honestjung/ocrserver:0.1.2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # GPU 1 — OCR 모드 (mode-ocr.sh로 활성화)
  chandra-b:
    profiles: [ocr]
    image: honestjung/ocrserver:0.1.2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # GPU 1 — LLM 모드 (mode-llm.sh로 활성화)
  llm:
    profiles: [llm]
    image: vllm/vllm-openai:latest
    command: >-
      Qwen/Qwen3-32B-AWQ
      --served-model-name qwen
      --dtype float16
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization ${LLM_GPU_UTIL:-0.60}
      --max-model-len ${LLM_MAX_MODEL_LEN:-16384}
      --trust-remote-code
      --enforce-eager
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 1800s
    restart: unless-stopped
