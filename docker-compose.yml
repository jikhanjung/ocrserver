services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chandra-a
      - wrapper
    restart: unless-stopped

  wrapper:
    image: honestjung/ocrwrapper:0.1.3
    environment:
      VLLM_URL: http://nginx:80
      OCR_CONCURRENCY: "${OCR_CONCURRENCY:-6}"
      OCR_DPI: "150"
      DB_PATH: /data/ocrserver.db
    volumes:
      - ./data:/data
    depends_on:
      - chandra-a
    restart: unless-stopped

  chandra-a:
    image: honestjung/ocrserver:0.1.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # GPU 1 — OCR 모드 (mode-ocr.sh로 활성화)
  chandra-b:
    profiles: [ocr]
    image: honestjung/ocrserver:0.1.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    volumes:
      - ./pdfs:/workspace/pdfs:ro
      - ./ocr_json:/workspace/ocr_json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # GPU 1 — LLM 모드 (mode-llm.sh로 활성화)
  llm:
    profiles: [llm]
    image: vllm/vllm-openai:latest
    command: >-
      Qwen/Qwen3-14B
      --served-model-name qwen
      --dtype float16
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.90
      --max-model-len 32768
      --trust-remote-code
      --enforce-eager
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 1800s
    restart: unless-stopped
